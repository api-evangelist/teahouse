name: Teahouse Finance
description: >-
  Teahouse Finance, founded in 2021, is a multi-strategy DeFi asset-management
  platform that sits as a simplified layer above protocols such as Uniswap V3,
  removing the complexity of managing liquidity and crypto assets. It runs
  audited smart-contract vaults across multiple chains — LP Vaults, Portfolio
  Vaults, the Easy-Earn delta-neutral strategy, and Tea-REX — for both
  individual and enterprise clients. Teahouse exposes a public read-only
  Vault API (HTTP/JSON) over its permissionless vaults: the vault catalog,
  per-vault performance time series (TVL, fee APR, share-token APR, share
  price), and account/vault share transaction logs. Vaults are of type V3Pair
  (a single Uniswap V3 LP pair) or V3Port (a portfolio of multiple positions).
  Surfaced as a portfolio company of Pantera Capital and enriched into the API
  Evangelist network from its published developer documentation.
